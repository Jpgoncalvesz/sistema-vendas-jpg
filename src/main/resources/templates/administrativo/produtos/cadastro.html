    <div class="container">
		
	
	
    
        <form action="/salvarProduto" th:object="${produto}" method="POST">
<label>ID:</label>
<input type="text" readonly="readonly" class="form-control" id="id" th:field="*{id}">
<label>Nome Produto:</label>
<input type="text" class="form-control" id="nome" th:field="*{nome}">
<label>Código de Barras:</label>
<input type="text" class="form-control" id="codigoBarras" th:field="*{codigoBarras}">
<label>Unidade de Medida:</label>
<input type="text" class="form-control" id="unidadeMedida" th:field="*{unidadeMedida}">
<div class="row"><div class="col-md"><label>Estoque:</label>
<input type="number" class="form-control" id="estoque" th:field="*{estoque}">
</div><div class="col-md"><label>Preço de Custo:</label>
<input type="number" class="form-control" id="precoCusto" th:field="*{precoCusto}">
</div><div class="col-md"><label>Preço de Venda:</label>
<input type="number" class="form-control" id="precoVenda" th:field="*{precoVenda}">
</div><div class="col-md"><label>Lucro:</label>
<input type="number" class="form-control" id="lucro" th:field="*{lucro}">
</div><div class="col-md"><label>Margem de Lucro:</label>
<input type="number" class="form-control" id="margemLucro" th:field="*{margemLucro}">
</div></div>
<button type="submit" class="btn btn-primary" style="margin-top: 10px;"><i class="fa-solid fa-floppy-disk"></i> Salvar</button>
<a class="btn btn-danger" href="/administrativo" style="margin-top: 10px;"><i class="fa-solid fa-share"></i> Voltar</a>
<a class="btn btn-success" href="/listarProduto" style="margin-top: 10px;"><i class="fa-solid fa-list"></i> Listar</a>
</form>
    

</div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
