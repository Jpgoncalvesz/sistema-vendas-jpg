    <div class="container">
		
	
	
    
        <form action="/salvarCidade" th:object="${cidade}" method="POST">
<div class="form-group"><label>ID:</label>
<input type="text" readonly="readonly" class="form-control" id="id" th:field="*{id}">
<label>Nome Cidade:</label>
<input type="text" required class="form-control" id="nome" th:field="*{nome}">
<label>CEP:</label>
<input type="text" required class="form-control" id="cep" th:field="*{cep}">
<label>Estado:</label>
<select th:field="*{estado}" class="form-control"><option th:each="est : ${listaEstados}" th:value="${est.id}" th:text="${est.nome}"></option></select>
</div><button type="submit" class="btn btn-primary" style="margin-top: 10px;"><i class="fa-solid fa-floppy-disk"></i> Salvar</button>
<a class="btn btn-danger" href="/administrativo" style="margin-top: 10px;"><i class="fa-solid fa-share"></i> Voltar</a>
<a class="btn btn-success" href="/listarCidade" style="margin-top: 10px;"><i class="fa-solid fa-list"></i> Listar</a>
</form>
    

</div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
<script>$(document).ready(function(){
$('#cep').mask('99.999-999');
});</script>
