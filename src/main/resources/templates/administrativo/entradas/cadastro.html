    <div class="container">
		
	
	
    
        <form action="/salvarEntrada" th:object="${entrada}" method="POST">
<div class="row" th:object="${itemEntrada}"><div class="col-md"><label>Produto:</label>
<select th:field="*{produto}" class="form-control"><option th:each="est : ${listaProdutos}" th:value="${est.id}" th:text="${est.nome}"></option></select>
</div><div class="col-md"><label>Quantidade:</label>
<input type="text" class="form-control" id="quantidade" th:field="*{quantidade}">
</div><div class="col-md"><label>Valor de Custo:</label>
<input type="text" class="form-control" id="valorCusto" th:field="*{valorCusto}">
</div><div class="col-md"><label>Valor de Venda:</label>
<input type="text" class="form-control" id="valor" th:field="*{valor}">
</div><div class="col-md"><br><button type="submit" name="acao" value="itens" class="btn btn-primary"><i class="fa-solid fa-cart-plus"></i> Adicionar</button></div></div><br>
<div class="row"><div class="col-md-3"><div class="form-group"><label>ID:</label>
<input type="text" readonly="readonly" class="form-control" id="id" th:field="*{id}">
<label>Observação:</label>
<input type="text" class="form-control" id="obs" th:field="*{obs}">
<label>Funcionário:</label>
<select th:field="*{funcionario}" class="form-control"><option th:each="est : ${listaFuncionarios}" th:value="${est.id}" th:text="${est.nome}"></option></select>
<label>Fornecedor:</label>
<select th:field="*{fornecedor}" class="form-control"><option th:each="est : ${listaFornecedores}" th:value="${est.id}" th:text="${est.nome}"></option></select>
<label>Valor Total:</label>
<input type="text" readonly="readonly" class="form-control" id="valorTotal" th:field="*{valorTotal}">
<label>Quantidade Total:</label>
<input type="text" readonly="readonly" class="form-control" id="quantidadeTotal" th:field="*{quantidadeTotal}">
</div></div><div class="col-md-9"><table class="table table-striped"><thead class="bg-primary"><tr><td>ID</td><td>Produto</td><td>Quantidade</td><td>Valor Custo</td><td>Valor venda</td><td>Ação</td></tr></thead><tbody><tr th:each="itemEntrada: ${listaItemEntrada}"><td th:text="${itemEntrada.id}"></td><td th:text="${itemEntrada.produto.nome}"></td><td th:text="${itemEntrada.quantidade}"></td><td th:text="${itemEntrada.valorCusto}"></td><td th:text="${itemEntrada.valor}"></td><td><a th:href="@{/removerItemEntrada/{id}(id=${itemEntrada.id})}"><i class="fa-solid fa-trash-can" style="color: rgb(220, 55, 22);"></i></a></td></tr></tbody></table></div></div><button type="submit" name="acao" value="salvar" class="btn btn-primary" style="margin-top: 10px;"><i class="fa-solid fa-floppy-disk"></i> Salvar</button>
<a class="btn btn-danger" href="/administrativo" style="margin-top: 10px;"><i class="fa-solid fa-share"></i> Voltar</a>
<a class="btn btn-success" href="/listarEntrada" style="margin-top: 10px;"><i class="fa-solid fa-list"></i> Listar</a>
</form>
    

</div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
  </body>
</html>
