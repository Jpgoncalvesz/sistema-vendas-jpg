name: Verificacao Maven

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: loja
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: teste_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d loja"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/loja
      DB_USERNAME: postgres
      DB_PASSWORD: teste_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Permitir execucao do Maven Wrapper
        run: chmod +x mvnw
      - name: Compilar e executar os testes
        run: ./mvnw --batch-mode verify
